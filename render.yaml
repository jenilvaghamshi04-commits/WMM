services:
  - type: web
    name: wmm-teamradar
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DASHBOARD_KEY
        generateValue: true
      - key: SITE_ORIGIN
        value: https://teamradar-telegram-desk.jenilvaghamshi04.chatgpt.site
      - key: DATA_DIR
        value: /tmp/teamradar-data
