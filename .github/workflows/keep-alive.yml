name: WMM server keep-alive

on:
  schedule:
    # Offset from the hour, with one check every ten minutes.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/keep-alive.yml'
      - 'config/keep-alive.json'
      - 'scripts/ping_gateway.py'

permissions:
  contents: read

concurrency:
  group: wmm-server-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read keep-alive configuration
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check WMM server health
        env:
          WMM_GATEWAY_URL: ${{ vars.WMM_GATEWAY_URL }}
        run: python3 scripts/ping_gateway.py
